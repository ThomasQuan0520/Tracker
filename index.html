<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CYMO</title>
    <style>
        @font-face {
            font-family: 'Crisis';
            src: url('fonts/CRISIS.ttf') format('truetype');
        }
        @font-face {
            font-family: 'MonaspaceXenon';
            src: url('fonts/MonaspaceXenon-Regular.otf') format('opentype');
        }
        @font-face {
            font-family: 'Chusung';
            src: url('fonts/Chusung.ttf') format('truetype');
        }

        :root {
            --bg: #000000;
            --text-red: #ffffff; 
            --text-red-dim: #bbbbbb;
            --text-yellow: #888888;
            --text-dim: #333333;
            --text-header: #FFFFFF;
            --highlight: #222222;
            --dot-glow: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
            --workspace-content-left: 20px;
            --workspace-content-right: 20px;
        }
        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text-red); 
            font-family: 'MonaspaceXenon', 'Chusung', 'Courier New', Courier, monospace;
            font-size: 16px;
            overflow: hidden;
            width: 100%;
            height: 100%;
            user-select: none;
            display: flex; 
            flex-direction: column;
        }
        body::after {
            content: " ";
            display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10; background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        header#glitch-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            padding: 8px 20px 10px var(--workspace-content-left);
            background-color: transparent;
            position: relative;
            z-index: 20;
            flex: 0 0 auto;
            box-sizing: border-box;
        }

        #master-scope-container {
            flex: 0 0 auto;
            position: absolute;
            right: 20px;
            top: 0;
            width: min(30vw, 300px);
            aspect-ratio: 21 / 9;
            height: auto;
            pointer-events: none;
            background-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #title-dot-matrix {
            display: block;
            width: clamp(240px, 28vw, 360px);
            height: auto;
            margin: 10px 0 0;
            filter: var(--dot-glow);
        }

        #header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            flex: 1 1 auto;
            max-width: calc(100% - min(30vw, 300px) - 20px);
            min-width: 0;
        }
        
        #workspace {
            flex: 0 0 auto;
            min-height: 0;
            display: flex; align-items: flex-start; justify-content: safe center; overflow: visible;
            position: relative; z-index: 5;
            box-sizing: border-box;
            padding: 0 20px 0 20px;
            padding-bottom: 0;
            background-color: transparent;
        }
        
        .step-numbers {
            position: sticky; left: 0; 
            background: rgba(0, 0, 0, 0.85);
            padding: 0 10px;
            color: var(--text-dim); z-index: 10;
            flex-shrink: 0;
        }
        .step-accent {
            color: #FFFFFF !important;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }
        .track {
            min-width: 108px;
            display: flex; flex-direction: column;
            flex-shrink: 0;
            transition: opacity 0.1s ease; 
        }
        .track-header {
            box-sizing: border-box;
            padding: 5px 4px;
            color: var(--text-header); text-align: center; height: 105px; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            flex: 0 0 auto;
            background: var(--bg);
        }
        .cell {
            height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: flex-start;
            padding: 0 4px;
        }
        
        .cell.active { background-color: #111; } 
        .cell.playing { background-color: transparent; } 
        .col-active { background-color: var(--highlight); outline: 1px solid var(--text-header); } 
        
        .note { color: var(--text-red); width: 3ch; font-size: 18px; line-height: 1; padding: 0; } 
        .velocity { color: var(--text-yellow); width: 2ch; font-size: 18px; line-height: 1; margin-left: 8px; padding: 0; }
        .empty { color: var(--text-dim); }
        
        .wave-canvas {
            background-color: #050505;
            image-rendering: pixelated; 
        }

        #master-scope {
            width: 100%; height: 100%; display: block; image-rendering: pixelated;
            filter: var(--dot-glow);
        }
        
        #top-bar {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 10px;
            padding: 0;
            background-color: transparent;
            color: var(--text-header);
            position: relative;
            z-index: 15;
            flex-wrap: wrap;
        }

        #tempo-status {
            display: flex;
            align-items: center;
            gap: 0;
            flex: 0 0 auto;
        }

        .status-dot-matrix {
            display: block;
            height: 28px;
            flex: 0 0 auto;
            image-rendering: pixelated;
            filter: var(--dot-glow);
        }

        #status-metronome {
            height: 28px;
        }

        #status-bpm-value {
            height: 32px;
        }

        #status-preset {
            max-width: 420px;
        }

        #status-steps {
            margin-left: 0;
        }
        
        #toast {
            position: fixed; top: 150px; left: 50%; transform: translateX(-50%);
            background-color: var(--text-red); color: var(--bg);
            padding: 5px 20px; font-weight: bold; z-index: 100;
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
        
        #shortcuts-toggle {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 46px;
            height: 46px;
            border: 1px solid var(--text-header);
            border-radius: 0;
            background: var(--bg);
            color: var(--text-header);
            cursor: pointer;
            font-family: 'MonaspaceXenon', 'Chusung', 'Courier New', Courier, monospace;
            font-size: 10px;
            letter-spacing: 0;
            z-index: 30;
        }

        #shortcuts-toggle:hover,
        #shortcuts-toggle[aria-expanded="true"] {
            background: var(--text-header);
            color: var(--bg);
        }

        #shortcuts-panel {
            position: fixed;
            right: 18px;
            bottom: 74px;
            width: min(720px, calc(100vw - 36px));
            max-height: min(480px, calc(100vh - 112px));
            display: none;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 18px;
            box-sizing: border-box;
            overflow-y: auto;
            padding: 14px;
            border: 1px solid var(--text-header);
            background: var(--bg);
            color: var(--text-header);
            font-size: 11px;
            z-index: 29;
        }

        #shortcuts-panel.is-open {
            display: grid;
        }

        #lang-toggle {
            grid-column: 1 / -1;
            justify-self: end;
            border: 1px solid var(--text-dim);
            border-radius: 0;
            background: var(--highlight);
            color: var(--text-header);
            padding: 4px 8px;
            cursor: pointer;
            font-family: 'MonaspaceXenon', 'Chusung', 'Courier New', Courier, monospace;
            font-size: 10px;
        }

        #lang-toggle:hover {
            border-color: var(--text-header);
        }

        #shortcuts-container {
            display: contents;
        }
        
        .shortcut-section {
            display: block; line-height: 1.3;
        }
        
        .shortcut-section span {
            color: var(--text-yellow); font-weight: bold;
        }
        #sample-browser {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.82);
        }
        #sample-browser.is-open { display: flex; }
        .sample-browser-panel {
            width: min(760px, calc(100vw - 40px));
            border: 1px solid var(--text-red-dim);
            background: var(--bg);
            box-shadow: 0 0 0 1px var(--text-dim), 0 0 28px rgba(255, 255, 255, 0.12);
        }
        .sample-browser-header, .sample-browser-footer {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 12px;
            color: var(--text-yellow);
            border-bottom: 1px solid var(--text-dim);
        }
        .sample-browser-footer {
            border-top: 1px solid var(--text-dim);
            border-bottom: 0;
            font-size: 12px;
            color: var(--text-red-dim);
        }
        #sample-browser-query { color: var(--text-red); }
        #sample-browser-list {
            height: 336px;
            overflow: hidden;
            padding: 6px 0;
        }
        .sample-browser-row {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr);
            gap: 10px;
            padding: 3px 12px;
            line-height: 1.4;
            color: var(--text-red-dim);
            white-space: nowrap;
        }
        .sample-browser-row.is-selected {
            color: var(--bg);
            background: var(--text-red);
        }
        .sample-browser-index { color: var(--text-dim); }
        .sample-browser-row.is-selected .sample-browser-index { color: var(--highlight); }
        .sample-browser-path { overflow: hidden; text-overflow: ellipsis; }
        #preset-browser {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.82);
        }
        #preset-browser.is-open { display: flex; }
        .preset-browser-panel {
            width: min(760px, calc(100vw - 40px));
            border: 1px solid var(--text-red-dim);
            background: var(--bg);
            box-shadow: 0 0 0 1px var(--text-dim), 0 0 28px rgba(255, 255, 255, 0.12);
        }
        .preset-browser-header, .preset-browser-footer {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 12px;
            color: var(--text-yellow);
            border-bottom: 1px solid var(--text-dim);
        }
        .preset-browser-footer {
            border-top: 1px solid var(--text-dim);
            border-bottom: 0;
            font-size: 12px;
            color: var(--text-red-dim);
        }
        #preset-browser-list { height: 336px; overflow: hidden; padding: 6px 0; }
        .preset-browser-row {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr);
            gap: 10px;
            padding: 3px 12px;
            line-height: 1.4;
            color: var(--text-red-dim);
            white-space: nowrap;
        }
        .preset-browser-row.is-selected { color: var(--bg); background: var(--text-red); }
        .preset-browser-index { color: var(--text-dim); }
        .preset-browser-row.is-selected .preset-browser-index { color: var(--highlight); }
        .preset-browser-path { overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
    <header id="glitch-header">
        <div id="header-right">
            <canvas id="title-dot-matrix" width="700" height="100"></canvas>
            <div id="top-bar">
                <div id="tempo-status">
                    <canvas id="status-metronome" class="status-dot-matrix" width="44" height="28"></canvas>
                    <canvas id="status-bpm-value" class="status-dot-matrix" width="52" height="32"></canvas>
                </div>
                <canvas id="status-steps" class="status-dot-matrix" width="80" height="28"></canvas>
                <canvas id="status-preset" class="status-dot-matrix" width="560" height="28"></canvas>
            </div>
        </div>
        <div id="master-scope-container">
            <canvas id="master-scope"></canvas>
        </div>
    </header>

    <div id="workspace">
        <div class="step-numbers" id="step-col"></div>
    </div>
    
    <button id="shortcuts-toggle" type="button" aria-expanded="false" aria-controls="shortcuts-panel">KEYS</button>
    <aside id="shortcuts-panel" aria-label="Keyboard shortcuts">
        <button id="lang-toggle" type="button">EN / 中文</button>
        <div id="shortcuts-container"></div>
    </aside>
    
    <div id="toast">SYSTEM MESSAGE</div>
    <section id="sample-browser" aria-label="Server sample browser" aria-modal="true" role="dialog">
        <div class="sample-browser-panel">
            <div class="sample-browser-header">
                <span>PACKS / SAMPLE BROWSER</span>
                <span id="sample-browser-count">LOADING</span>
            </div>
            <div class="sample-browser-header">
                <span>FILTER</span>
                <span id="sample-browser-query">ALL</span>
            </div>
            <div id="sample-browser-list"></div>
            <div class="sample-browser-footer">
                <span>UP/DOWN SELECT</span>
                <span>TYPE FILTER</span>
                <span>ENTER LOAD</span>
                <span>ESC CLOSE</span>
            </div>
        </div>
    </section>
    <section id="preset-browser" aria-label="Server preset browser" aria-modal="true" role="dialog">
        <div class="preset-browser-panel">
            <div class="preset-browser-header">
                <span>PRESETS / SERVER BROWSER</span>
                <span id="preset-browser-count">LOADING</span>
            </div>
            <div id="preset-browser-list"></div>
            <div class="preset-browser-footer">
                <span>UP/DOWN SELECT</span>
                <span>PAGEUP/PAGEDOWN JUMP</span>
                <span>ENTER LOAD</span>
                <span>ESC CLOSE</span>
            </div>
        </div>
    </section>
    <input type="file" id="file-input" accept="audio/*" style="display: none;">

<script src="dot-matrix.js"></script>
<script src="master-scope-animation.js"></script>
<script>
    let currentLang = 'en';
    
    const shortcuts = {
        en: [
            { label: 'Navigation', text: 'Arrow Up / Arrow Down: Move step | Arrow Left / Arrow Right: Move track or select column | Ctrl/Cmd+Arrow Left / Arrow Right: Change pattern (previous/next)' },
            { label: 'Playback', text: 'Space: Play / Stop | [: Decrease BPM | ]: Increase BPM' },
            { label: 'Edit', text: 'Z-M / Q-I: Insert notes | 0-9: Set velocity (two-digit entry) | Del / Backspace: Clear note | Ctrl/Cmd+Backspace: Clear current pattern' },
            { label: 'Samples', text: 'Enter: Open local sample file dialog | Ctrl/Cmd+Enter: Browse server packs | Pack browser: Type filter, Backspace delete filter, Up/Down select, PageUp/PageDown jump, Home/End first/last, Enter load, Esc close' },
            { label: 'File', text: 'Ctrl/Cmd+S: Export project (save) | Ctrl/Cmd+O: Browse server presets | Ctrl/Cmd+L: Load local autosave' },
            { label: 'Presets', text: 'Preset browser: Up/Down select, PageUp/PageDown jump, Home/End first/last, Enter load, Esc close' },
            { label: 'Control', text: 'Ctrl/Cmd+ArrowUp / ArrowDown: Track volume up/down | Ctrl/Cmd+]: Increase steps, Ctrl/Cmd+[: Decrease steps | Shift+Arrow keys: Adjust sends or FX params | \\ : Toggle mode (SMP/SLC) or cycle FX type | SLC mode: = Increase slices, - Decrease slices' },
            { label: 'Mute', text: 'Ctrl/Cmd+M: Toggle mute | Esc: Close shortcut panel' }
        ],
        zh: [
            { label: '导航', text: '↑ / ↓: 步进移动 | ← / →: 切换轨道或列 | Ctrl/Cmd+← / Ctrl/Cmd+→: 切换 Pattern（上一 / 下一）' },
            { label: '播放', text: '空格: 播放 / 停止 | [: BPM 减少 | ]: BPM 增加' },
            { label: '编辑', text: 'Z-M / Q-I: 输入音符 | 0-9: 设置力度（两位输入） | Del / Backspace: 清除音符 | Ctrl/Cmd+Backspace: 清空当前 Pattern' },
            { label: '采样', text: 'Enter: 打开本地采样文件选择 | Ctrl/Cmd+Enter: 浏览服务器采样包 | 采样浏览器：输入筛选，Backspace 删除筛选，↑/↓ 选择，PageUp/PageDown 跳转，Home/End 首尾，Enter 导入，Esc 关闭' },
            { label: '文件', text: 'Ctrl/Cmd+S: 导出项目（保存） | Ctrl/Cmd+O: 浏览服务器预设 | Ctrl/Cmd+L: 加载本地自动保存' },
            { label: '预设', text: '预设浏览器：↑/↓ 选择，PageUp/PageDown 跳转，Home/End 首尾，Enter 加载，Esc 关闭' },
            { label: '控制', text: 'Ctrl/Cmd+↑ / Ctrl/Cmd+↓: 提高/降低轨道音量 | Ctrl/Cmd+]: 增加步数, Ctrl/Cmd+[: 减少步数 | Shift+方向键: 调整发送量或效果参数 | \\ : 切换模式或循环效果类型 | SLC 模式：= 增加切片，- 减少切片' },
            { label: '静音', text: 'Ctrl/Cmd+M: 静音切换 | Esc: 关闭快捷键面板' }
        ]
    };
    
    function updateShortcutsDisplay() {
        const container = document.getElementById('shortcuts-container');
        const data = shortcuts[currentLang];
        container.innerHTML = data.map(s => {
            const lines = String(s.text).split('|').map(l => l.trim()).join('<br/>');
            return `<div class="shortcut-section"><span>${s.label}:</span><br/>${lines}</div>`;
        }).join('');
    }
    
    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'zh' : 'en';
        const btn = document.getElementById('lang-toggle');
        btn.innerText = currentLang === 'en' ? 'EN / 中文' : '英文 / 中文';
        updateShortcutsDisplay();
    }

    function toggleShortcutsPanel(forceOpen) {
        const panel = document.getElementById('shortcuts-panel');
        const toggle = document.getElementById('shortcuts-toggle');
        const isOpen = forceOpen ?? !panel.classList.contains('is-open');
        panel.classList.toggle('is-open', isOpen);
        toggle.setAttribute('aria-expanded', String(isOpen));
    }
    
    function truncateStatusText(canvas, text, fontSize, horizontalPadding = 12) {
        const ctx = canvas.getContext('2d');
        ctx.font = `bold ${fontSize}px 'MonaspaceXenon', monospace`;
        if (ctx.measureText(text).width <= canvas.width - horizontalPadding) return text;

        const suffix = '...';
        let truncated = text;
        while (truncated.length > 0 && ctx.measureText(`${truncated}${suffix}`).width > canvas.width - horizontalPadding) {
            truncated = truncated.slice(0, -1);
        }
        return `${truncated}${suffix}`;
    }

    function drawPresetStatus(timestamp = 0) {
        const canvas = document.getElementById('status-preset');
        const fontSize = 24;
        const fullFileName = currentPresetName || 'DEFAULT';
        const measureCtx = canvas.getContext('2d');
        measureCtx.font = `bold ${fontSize}px 'MonaspaceXenon', monospace`;
        const requiredWidth = Math.min(420, Math.max(96, Math.ceil(measureCtx.measureText(fullFileName).width) + 46));
        if (canvas.width !== requiredWidth) canvas.width = requiredWidth;

        const sourceCanvas = document.createElement('canvas');
        sourceCanvas.width = canvas.width;
        sourceCanvas.height = canvas.height;
        const ctx = sourceCanvas.getContext('2d');
        const fileName = truncateStatusText(canvas, fullFileName, fontSize, 40);
        ctx.font = `italic ${fontSize}px 'MonaspaceXenon', monospace`;
        const textWidth = ctx.measureText(fileName).width;
        const textX = Math.max(36, sourceCanvas.width - textWidth - 8);
        const iconX = textX - 29;
        const beatPhase = timestamp / 60000 * bpm * Math.PI * 2;
        const iconOffsetY = Math.sin(beatPhase) * 0.75;
        const foldOffset = Math.cos(beatPhase) * 0.75;

        ctx.strokeStyle = '#FFFFFF';
        ctx.fillStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(iconX, 5 + iconOffsetY);
        ctx.lineTo(iconX + 12, 5 + iconOffsetY);
        ctx.lineTo(iconX + 18, 11 + iconOffsetY);
        ctx.lineTo(iconX + 18, 21 + iconOffsetY);
        ctx.lineTo(iconX, 21 + iconOffsetY);
        ctx.closePath();
        ctx.moveTo(iconX + 12, 5 + iconOffsetY);
        ctx.lineTo(iconX + 12, 11 + iconOffsetY);
        ctx.lineTo(iconX + 18, 11 + iconOffsetY + foldOffset);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(iconX + 4, 14 + iconOffsetY);
        ctx.lineTo(iconX + 14, 14 + iconOffsetY);
        ctx.moveTo(iconX + 4, 17 + iconOffsetY);
        ctx.lineTo(iconX + 1, 17 + iconOffsetY);
        ctx.stroke();
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.fillText(fileName, textX, sourceCanvas.height / 2);

        drawDotMatrix(canvas, sourceCanvas, 0.7);
    }
    
    function drawTitleDotMatrix() {
        drawDotMatrixText(document.getElementById('title-dot-matrix'), "CYMO", titleBreathingAmount, 120, 'left', 16, 20);
    }

    function drawMetronome(timestamp) {
        const canvas = document.getElementById('status-metronome');
        const sourceCanvas = document.createElement('canvas');
        sourceCanvas.width = canvas.width;
        sourceCanvas.height = canvas.height;
        const ctx = sourceCanvas.getContext('2d');
        const pivotX = sourceCanvas.width / 2 + 6;
        const pivotY = 8;
        const armLength = 15;
        const beatPhase = timestamp / 60000 * bpm * Math.PI * 2;
        const angle = Math.sin(beatPhase) * 0.3;

        ctx.strokeStyle = '#FFFFFF';
        ctx.fillStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(pivotX - 6, 3);
        ctx.lineTo(pivotX + 6, 3);
        ctx.lineTo(pivotX + 10, 23);
        ctx.lineTo(pivotX - 10, 23);
        ctx.closePath();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pivotX - 10, 25);
        ctx.lineTo(pivotX + 10, 25);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pivotX - 5, 17);
        ctx.lineTo(pivotX + 5, 17);
        ctx.moveTo(pivotX - 4, 14);
        ctx.lineTo(pivotX + 4, 14);
        ctx.moveTo(pivotX - 3, 11);
        ctx.lineTo(pivotX + 3, 11);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(pivotX, pivotY, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(pivotX, pivotY);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, armLength);
        ctx.stroke();
        ctx.fillRect(-4, armLength - 6, 8, 4);
        ctx.fillRect(-2, armLength - 1, 4, 2);
        ctx.restore();

        drawDotMatrix(canvas, sourceCanvas, 0.7);
    }

    function drawBpmValue() {
        const canvas = document.getElementById('status-bpm-value');
        const fontSize = 24;
        const ctx = canvas.getContext('2d');
        ctx.font = `bold ${fontSize}px 'MonaspaceXenon', monospace`;
        const requiredWidth = Math.ceil(ctx.measureText(`${bpm}`).width) + 12;
        if (canvas.width !== requiredWidth) canvas.width = requiredWidth;
        drawDotMatrixText(canvas, `${bpm}`, 0.7, fontSize, 'left', 4);
    }

    function drawStepsStatus(timestamp = 0) {
        const canvas = document.getElementById('status-steps');
        const fontSize = 24;
        const stepText = `${NUM_STEPS}`;
        const measureCtx = canvas.getContext('2d');

    function createReverbIR(duration, decay) {
        const length = Math.max(1, audioCtx.sampleRate * duration);
        const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
        const left = impulse.getChannelData(0);
        const right = impulse.getChannelData(1);
        for (let i = 0; i < length; i++) {
            const d = Math.pow(1 - i / length, decay);
            left[i] = (Math.random() * 2 - 1) * d;
            right[i] = (Math.random() * 2 - 1) * d;
        }
        return impulse;
    }

    function makeDistortionCurve(amount) {
        const k = amount, n_samples = 44100, curve = new Float32Array(n_samples), deg = Math.PI / 180;
        for (let i = 0; i < n_samples; ++i) {
            const x = i * 2 / n_samples - 1;
            curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
        }
        return curve;
    }

    function arrayBufferToBase64(buffer) {
        let binary = '';
        const bytes = new Uint8Array(buffer);
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
        const binary = atob(base64);
        const len = binary.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
        return bytes.buffer;
    }

    async function audioBufferToWavBase64(buffer, targetRate = 44100) {
        let renderBuf = buffer;
        if (Math.round(buffer.sampleRate) !== targetRate) {
            try {
                const offline = new OfflineAudioContext(buffer.numberOfChannels, Math.ceil(buffer.duration * targetRate), targetRate);
                const src = offline.createBufferSource(); src.buffer = buffer; src.connect(offline.destination); src.start(0);
                renderBuf = await offline.startRendering();
            } catch (e) {
                renderBuf = buffer;
            }
        }

        const numChannels = renderBuf.numberOfChannels;
        const sampleRate = renderBuf.sampleRate;
        const length = renderBuf.length * numChannels * 2 + 44;
        const arrayBuffer = new ArrayBuffer(length);
        const view = new DataView(arrayBuffer);

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
        }

        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + renderBuf.length * numChannels * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, numChannels, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * numChannels * 2, true);
        view.setUint16(32, numChannels * 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, renderBuf.length * numChannels * 2, true);

        let offset = 44;
        const channels = [];
        for (let c = 0; c < numChannels; c++) channels.push(renderBuf.getChannelData(c));

        for (let i = 0; i < renderBuf.length; i++) {
            for (let c = 0; c < numChannels; c++) {
                let sample = Math.max(-1, Math.min(1, channels[c][i]));
                view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                offset += 2;
            }
        }

        return arrayBufferToBase64(arrayBuffer);
    }

    function changeFX(busIndex, type) {
        const info = busIndex === 0 ? fx1NodeInfo : fx2NodeInfo;
        
        safeDisconnect(info.filter);
        safeDisconnect(info.delay);
        safeDisconnect(info.fb);
        safeDisconnect(info.shaper);
        safeDisconnect(info.gain);
        safeDisconnect(info.convolver);

        info.type = type;
        info.filter = null; info.delay = null; info.fb = null; info.shaper = null; info.gain = null; info.convolver = null;
        info.reverbKey = null;
        info.distortionAmount = null;

        switch(type) {
            case 'LPF':
            case 'HPF':
                info.filter = audioCtx.createBiquadFilter();
                info.filter.type = type === 'LPF' ? 'lowpass' : 'highpass';
                info.input.connect(info.filter).connect(info.output);
                break;
            case 'DLY':
                info.delay = audioCtx.createDelay(2.0);
                info.fb = audioCtx.createGain();
                info.input.connect(info.delay).connect(info.output);
                info.delay.connect(info.fb).connect(info.delay);
                break;
            case 'DIST':
                info.shaper = audioCtx.createWaveShaper();
                info.shaper.oversample = '4x';
                info.gain = audioCtx.createGain();
                info.input.connect(info.shaper).connect(info.gain).connect(info.output);
                break;
            case 'RVB':
                info.convolver = audioCtx.createConvolver();
                info.input.connect(info.convolver).connect(info.output);
                break;
            default:
                info.input.connect(info.output);
                break;
        }
        updateFXParams(busIndex);
    }

    function updateFXParams(busIndex) {
        const track = tracks[10 + busIndex];
        const info = busIndex === 0 ? fx1NodeInfo : fx2NodeInfo;
        const p1 = track.p1; const p2 = track.p2;

        if (info.type === 'LPF' || info.type === 'HPF') {
            info.filter.frequency.value = 20 * Math.pow(1000, p1 / 100); 
            info.filter.Q.value = p2 / 5; 
        } else if (info.type === 'DLY') {
            info.delay.delayTime.value = p1 / 100; 
            info.fb.gain.value = (p2 / 100) * 0.9; 
        } else if (info.type === 'DIST') {
            if (info.distortionAmount !== p1) {
                info.shaper.curve = makeDistortionCurve(p1 * 10);
                info.distortionAmount = p1;
            }
            info.gain.gain.value = p2 / 100; 
        } else if (info.type === 'RVB') {
            const reverbKey = `${p1}:${p2}`;
            if (info.reverbKey !== reverbKey) {
                const duration = 0.1 + (p1 / 100) * 4.9;
                const decay = 1.0 + (p2 / 100) * 4.0;
                info.convolver.buffer = createReverbIR(duration, decay);
                info.reverbKey = reverbKey;
            }
        }
    }

    let nextNoteTime = 0; let currentStep = 0; let timerID;let completedRounds = 0; // 新增：用于记录走完的轮数
    const uiQueue = []; let lastDrawnStep = -1;

    function playSample(trackIndex, noteNum, velocity, time) {
        const track = tracks[trackIndex];
        if (track.type !== 'AUDIO' || !track.buffer) return;

        const safeTime = time === 0 ? audioCtx.currentTime : time;

        // A live keyboard audition (time === 0) must not cancel a sequencer hit
        // that has already been scheduled into the audio lookahead window.
        if (time !== 0 && track.activeSource && track.activeVelNode) {
            track.activeVelNode.gain.cancelScheduledValues(safeTime);
            track.activeVelNode.gain.setValueAtTime(track.activeVelNode.gain.value, safeTime);
            track.activeVelNode.gain.linearRampToValueAtTime(0, safeTime + 0.005);
            try { track.activeSource.stop(safeTime + 0.005); } catch(e) {}
        }

        const source = audioCtx.createBufferSource();
        const velNode = audioCtx.createGain(); 
        const volNode = audioCtx.createGain(); 
        
        source.buffer = track.buffer;
        
        let startOffset = 0; let duration = track.buffer.duration;

        if (track.mode === 'SMP') {
            source.playbackRate.value = Math.pow(2, (noteNum - 72) / 12);
        } else if (track.mode === 'SLC') {
            const sliceIndex = Math.max(0, noteNum - 60);
            duration = track.buffer.duration / track.slices; 
            startOffset = (sliceIndex % track.slices) * duration;
        }

        const velGain = (velocity !== null ? velocity : 80) / 127;
        velNode.gain.setValueAtTime(0, safeTime);
        velNode.gain.linearRampToValueAtTime(velGain, safeTime + 0.002);

        const trackVol = track.muted ? 0 : (track.volume / 100);
        volNode.gain.setValueAtTime(trackVol, safeTime);
        
        source.connect(velNode);
        velNode.connect(volNode);
        volNode.connect(masterGain); 

        if (track.send1 > 0) {
            volNode.connect(track.send1Node);
        }
        if (track.send2 > 0) {
            volNode.connect(track.send2Node);
        }

        source.onended = () => {
            safeDisconnect(source);
            safeDisconnect(velNode);
            safeDisconnect(volNode);
            if (track.activeSource === source) {
                track.activeSource = null;
                track.activeVelNode = null;
                track.activeVolNode = null;
            }
        };
        
        if (track.mode === 'SLC') { source.start(safeTime, startOffset, duration); } 
        else { source.start(safeTime, startOffset); }

        if (time !== 0) {
            track.activeSource = source;
            track.activeVelNode = velNode;
            track.activeVolNode = volNode;
        }
    }

    function scheduleNote() {
        const secondsPerBeat = 60.0 / bpm;
        const scheduledTime = nextNoteTime;
        uiQueue.push({ step: currentStep, time: scheduledTime });

        for (let t = 0; t < NUM_TRACKS; t++) {
            const stepData = tracks[t].patterns[tracks[t].currentPattern][currentStep];
            if (stepData && stepData.note !== null) playSample(t, stepData.note, stepData.velocity, scheduledTime);
        }
        nextNoteTime += 0.25 * secondsPerBeat;
        currentStep = (currentStep + 1) % NUM_STEPS;
        if (currentStep === 0) {
            completedRounds++;
        }
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + 0.1) scheduleNote();
        timerID = setTimeout(scheduler, 25.0);
    }

    function getCurrentPlaybackStep() {
        const currentTime = audioCtx.currentTime;
        let step = lastDrawnStep;
        for (const event of uiQueue) {
            if (event.time > currentTime) break;
            step = event.step;
        }
        if (step >= 0) return step;
        return uiQueue[0]?.step ?? cursor.s;
    }

    async function serializeState() {
        const out = { bpm, NUM_STEPS, tracks: [] };
        for (let i = 0; i < tracks.length; i++) {
            const t = tracks[i];
            const entry = {
                type: t.type, mode: t.mode, slices: t.slices,
                volume: t.volume, muted: t.muted,
                send1: t.send1, send2: t.send2,
                p1: t.p1, p2: t.p2, fxType: t.fxType,
                fileName: t.fileName, currentPattern: t.currentPattern,
                patterns: t.patterns
            };
            if (t.type === 'AUDIO' && t.buffer) {
                try {
                    const base64 = await audioBufferToWavBase64(t.buffer, 44100);
                    entry.sampleWav = base64; 
                } catch (e) {
                    console.warn('Failed to encode sample for track', i, e);
                }
            }
            out.tracks.push(entry);
        }
        return JSON.stringify(out);
    }

    function normalizePatterns(patterns) {
        return Array.from({length: 4}, (_, index) => {
            const sourcePattern = Array.isArray(patterns?.[index]) ? patterns[index] : [];
            const normalized = sourcePattern.slice(0, NUM_STEPS).map(step => ({
                note: step && typeof step.note === 'number' ? step.note : null,
                velocity: step && typeof step.velocity === 'number' ? step.velocity : null
            }));
            while (normalized.length < NUM_STEPS) {
                normalized.push({ note: null, velocity: null });
            }
            return normalized;
        });
    }

    async function loadState(jsonStr) {
        try {
            const state = JSON.parse(jsonStr);
            bpm = typeof state.bpm === 'number' && state.bpm > 0 ? state.bpm : 120;

            NUM_STEPS = Math.max(4, Math.min(128, state.NUM_STEPS || 16));

            for (let i = 0; i < (state.tracks || []).length && i < tracks.length; i++) {
                const savedT = state.tracks[i];
                const t = tracks[i];
                t.mode = savedT.mode || 'SMP';
                t.slices = Number.isInteger(savedT.slices) ? savedT.slices : 16;
                t.volume = typeof savedT.volume === 'number' ? savedT.volume : 100;
                t.muted = !!savedT.muted;
                t.send1 = typeof savedT.send1 === 'number' ? savedT.send1 : 0;
                t.send2 = typeof savedT.send2 === 'number' ? savedT.send2 : 0;
                if (t.type === 'AUDIO') updateTrackSends(t);
                t.p1 = typeof savedT.p1 === 'number' ? savedT.p1 : 50;
                t.p2 = typeof savedT.p2 === 'number' ? savedT.p2 : 50;
                t.fxType = savedT.fxType || 'OFF';
                t.fileName = savedT.fileName || null;
                t.currentPattern = Number.isInteger(savedT.currentPattern) ? savedT.currentPattern : 0;
                if (t.currentPattern < 0 || t.currentPattern > 3) t.currentPattern = 0;

                if (savedT.patterns) {
                    t.patterns = normalizePatterns(savedT.patterns);
                } else if (savedT.steps) {
                    t.patterns = normalizePatterns([savedT.steps]);
                } else {
                    t.patterns = normalizePatterns([]);
                }

                if (t.type === 'AUDIO' && savedT.sampleWav) {
                    try {
                        const ab = base64ToArrayBuffer(savedT.sampleWav);
                        const decoded = await audioCtx.decodeAudioData(ab.slice(0));
                        t.buffer = decoded;
                    } catch (e) {
                        console.warn('Failed to decode sample for track', i, e);
                        t.buffer = null;
                    }
                }

                if (t.type === 'FX') changeFX(i - 10, t.fxType);
            }

            cursor = { t: 0, s: 0, c: 0 }; editHalf = 0; currentStep = 0;
            uiQueue.length = 0; lastDrawnStep = -1;

            renderTrackerViewport(cursor.s);
            resizeScope();
            updateStatusDisplay(); updateCursorUI(0,0,0,0,0,0);
            showToast("DATA LOADED SUCCESSFULLY");
        } catch (e) {
            console.error("Load Error:", e);
            showToast("LOAD ERROR");
        }
    }

    function alignScopeMidlineToTitleBottom() {
        const scopeContainer = document.getElementById('master-scope-container');

        const headerRect = header.getBoundingClientRect();
        const titleRect = titleCanvas.getBoundingClientRect();
        const scopeRect = scopeContainer.getBoundingClientRect();
        const desiredCenterY = titleRect.bottom - headerRect.top;
        const currentTop = scopeRect.top - headerRect.top;

    let lastScopeDrawTime = 0;

    function renderMasterScope() {
        masterScopeAnimation.renderWaveform({ analyser, scopeDataArray, breathingAmount: titleBreathingAmount });
        return;

        const w = scopeCanvas.width; const h = scopeCanvas.height;
        const sourceCtx = scopeSourceCanvas.getContext('2d');
        sourceCtx.clearRect(0, 0, w, h);
        
        analyser.getByteTimeDomainData(scopeDataArray);

        const sliceWidth = w * 1.0 / analyser.frequencyBinCount;
        sourceCtx.fillStyle = '#FFFFFF';
        sourceCtx.strokeStyle = '#FFFFFF';
        sourceCtx.lineWidth = 2;
        sourceCtx.lineCap = 'round';
        sourceCtx.beginPath();
        
        for (let i = 0; i < analyser.frequencyBinCount; i += 2) {
            let normalized = (scopeDataArray[i] - 128) / 128.0; 
            normalized = normalized * 2; 
            normalized = Math.max(-1, Math.min(1, normalized)); 
            
            const y = Math.floor((normalized + 1) * h / 2);
            const x = Math.floor(i * sliceWidth);
            if (i === 0) sourceCtx.moveTo(x, y);
            else sourceCtx.lineTo(x, y);
            sourceCtx.moveTo(x, h / 2);
            sourceCtx.lineTo(x, y);
            sourceCtx.moveTo(x, y);
        }
        sourceCtx.stroke();
        drawDotMatrix(scopeCanvas, scopeSourceCanvas, titleBreathingAmount);
    }
    function renderComicEye(timestamp) {
        masterScopeAnimation.renderTearEye({ timestamp, breathingAmount: titleBreathingAmount });
