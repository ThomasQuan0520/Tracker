        const w = scopeCanvas.width; const h = scopeCanvas.height;
        const sourceCtx = scopeSourceCanvas.getContext('2d');
        sourceCtx.clearRect(0, 0, w, h);

        const cx = w / 2;
        const cy = h / 2;
        
        const eyeW = h * 0.55;  
        const eyeH = h * 0.22;  

        sourceCtx.fillStyle = '#FFFFFF';
        sourceCtx.strokeStyle = '#FFFFFF';
        sourceCtx.lineCap = 'round';
        sourceCtx.lineJoin = 'round';

        // 1. 背景排线
        sourceCtx.lineWidth = 1;
        for (let i = -w; i < w * 2; i += 15) {
            sourceCtx.beginPath();
            sourceCtx.moveTo(i, 0);
            sourceCtx.lineTo(i - h, h);
            sourceCtx.stroke();
        }

        // 清理眼部区域底色
        sourceCtx.globalCompositeOperation = 'destination-out';
        sourceCtx.beginPath();
        sourceCtx.moveTo(cx - eyeW, cy - eyeH * 0.3); 
        sourceCtx.bezierCurveTo(cx - eyeW * 0.3, cy - eyeH * 1.6, cx + eyeW * 0.5, cy - eyeH * 1.2, cx + eyeW, cy + eyeH * 0.4); 
        sourceCtx.bezierCurveTo(cx + eyeW * 0.3, cy + eyeH * 1.2, cx - eyeW * 0.4, cy + eyeH * 0.9, cx - eyeW, cy - eyeH * 0.3); 
        sourceCtx.fill();
        sourceCtx.globalCompositeOperation = 'source-over';

        // 2. 虹膜与瞳孔剪裁
        sourceCtx.save();
        sourceCtx.beginPath();
        sourceCtx.moveTo(cx - eyeW, cy - eyeH * 0.3);
        sourceCtx.bezierCurveTo(cx - eyeW * 0.3, cy - eyeH * 1.6, cx + eyeW * 0.5, cy - eyeH * 1.2, cx + eyeW, cy + eyeH * 0.4);
        sourceCtx.bezierCurveTo(cx + eyeW * 0.3, cy + eyeH * 1.2, cx - eyeW * 0.4, cy + eyeH * 0.9, cx - eyeW, cy - eyeH * 0.3);
        sourceCtx.clip();

        const irisX = cx - eyeW * 0.05;
        const irisY = cy - eyeH * 0.2;
        const irisR = eyeH * 0.75; 
        sourceCtx.lineWidth = 2;
        sourceCtx.beginPath();
        sourceCtx.arc(irisX, irisY, irisR, 0, Math.PI * 2);
        sourceCtx.stroke();
        sourceCtx.beginPath();
        sourceCtx.arc(irisX, irisY, irisR * 0.4, 0, Math.PI * 2);
        sourceCtx.fill();

        // 眼球高光
        sourceCtx.globalCompositeOperation = 'destination-out';
        sourceCtx.beginPath();
        sourceCtx.arc(irisX - irisR * 0.3, irisY - irisR * 0.3, irisR * 0.25, 0, Math.PI * 2);
        sourceCtx.fill();
        sourceCtx.globalCompositeOperation = 'source-over';
        sourceCtx.restore(); 

        // 3. 上下眼线
        sourceCtx.lineWidth = 3.5; 
        sourceCtx.beginPath();
        sourceCtx.moveTo(cx - eyeW, cy - eyeH * 0.3);
        sourceCtx.bezierCurveTo(cx - eyeW * 0.3, cy - eyeH * 1.6, cx + eyeW * 0.5, cy - eyeH * 1.2, cx + eyeW, cy + eyeH * 0.4);
        sourceCtx.stroke();
        
        sourceCtx.lineWidth = 1.2; 
        sourceCtx.beginPath();
        sourceCtx.moveTo(cx - eyeW, cy - eyeH * 0.3);
        sourceCtx.bezierCurveTo(cx + eyeW * 0.3, cy + eyeH * 1.2, cx - eyeW * 0.4, cy + eyeH * 0.9, cx - eyeW, cy - eyeH * 0.3);
        sourceCtx.stroke();

        // 4. 重磅升级：像漫画手绘一样华丽、具有粗细变化的“漫画实体睫毛”
        // 我们用路径填充（fill）代替单线条，让每一根睫毛都像微型墨水尖一样立体、优美
        const drawLashBlock = (x1, y1, tipX, tipY, x2, y2) => {
            sourceCtx.beginPath();
            sourceCtx.moveTo(x1, y1);
            sourceCtx.lineTo(tipX, tipY);
            sourceCtx.lineTo(x2, y2);
            sourceCtx.closePath();
            sourceCtx.fill();
        };

        // 上眼睫毛群组（根部扎实，向外向上划出极其优雅的弧线飞翘）
        // 外眼角最长最浓密的睫毛
        drawLashBlock(cx + eyeW * 0.85, cy + eyeH * 0.1, cx + eyeW * 1.3, cy - eyeH * 0.5, cx + eyeW * 0.95, cy - eyeH * 0.1);
        drawLashBlock(cx + eyeW * 0.7,  cy - eyeH * 0.3, cx + eyeW * 1.15, cy - eyeH * 0.9, cx + eyeW * 0.8,  cy - eyeH * 0.5);
        // 中上部睫毛
        drawLashBlock(cx + eyeW * 0.4,  cy - eyeH * 0.75, cx + eyeW * 0.75, cy - eyeH * 1.4, cx + eyeW * 0.55, cy - eyeH * 0.95);
        drawLashBlock(cx + eyeW * 0.05, cy - eyeH * 0.95, cx + eyeW * 0.25, cy - eyeH * 1.65, cx + eyeW * 0.2,  cy - eyeH * 1.15);
        // 内眼角微翘睫毛
        drawLashBlock(cx - eyeW * 0.3,  cy - eyeH * 0.8,  cx - eyeW * 0.25, cy - eyeH * 1.5, cx - eyeW * 0.15, cy - eyeH * 1.0);

        // 下眼睫毛（短小、疏落有致，同样采用实体小尖角）
        drawLashBlock(cx + eyeW * 0.5,  cy + eyeH * 0.7,  cx + eyeW * 0.7,  cy + eyeH * 1.2, cx + eyeW * 0.58, cy + eyeH * 0.85);
        drawLashBlock(cx + eyeW * 0.15, cy + eyeH * 0.82, cx + eyeW * 0.22, cy + eyeH * 1.3, cx + eyeW * 0.25, cy + eyeH * 0.95);

        // 5. 流泪动画
        const tDuration = 1400; 
        let t = (timestamp % tDuration) / tDuration; 
        
        const tearStartX = cx + eyeW * 0.42;
        const tearStartY = cy + eyeH * 0.7; 
        const dropEndY = tearStartY + h * 0.5; 
        const dropY = tearStartY + Math.pow(t, 1.8) * (h * 0.5);

        sourceCtx.fillStyle = '#FFFFFF';
        if (t < 0.25) {
            const poolSize = (t / 0.25) * 5;
            sourceCtx.beginPath();
            sourceCtx.arc(tearStartX, tearStartY, poolSize, 0, Math.PI);
            sourceCtx.fill();
        } else if (t < 0.8) {
            const size = 4.5;
            sourceCtx.beginPath();
            sourceCtx.moveTo(tearStartX, dropY - size * 2);
            sourceCtx.bezierCurveTo(tearStartX + size, dropY - size, tearStartX + size, dropY + size, tearStartX, dropY + size);
            sourceCtx.bezierCurveTo(tearStartX - size, dropY + size, tearStartX - size, dropY - size, tearStartX, dropY - size * 2);
            sourceCtx.fill();
        } else {
            const splashT = (t - 0.8) / 0.2; 
            sourceCtx.beginPath();
            sourceCtx.arc(tearStartX - 7 * splashT, dropEndY, 2 * Math.max(0, 1 - splashT), 0, Math.PI * 2);
            sourceCtx.arc(tearStartX + 7 * splashT, dropEndY - 4 * splashT, 1.5 * Math.max(0, 1 - splashT), 0, Math.PI * 2);
            sourceCtx.fill();
        }

        // 6. 转换为点阵 LED 效果
        drawDotMatrix(scopeCanvas, scopeSourceCanvas, titleBreathingAmount);
    }

    function renderPedestrianCrossing(timestamp) {
        masterScopeAnimation.renderPedestrianCrossing({ timestamp, breathingAmount: titleBreathingAmount });
    }

    function renderLunarWaves(timestamp) {
        masterScopeAnimation.renderLunarWaves({ timestamp, breathingAmount: titleBreathingAmount });
    }
    function drawLoop(timestamp) {
        if (!timestamp) timestamp = performance.now();

        if (isPlaying) {
            let currentVisualStep = lastDrawnStep; 
            const currentTime = audioCtx.currentTime;
            let consumedEvents = 0;
            while (consumedEvents < uiQueue.length && uiQueue[consumedEvents].time <= currentTime) {
                currentVisualStep = uiQueue[consumedEvents].step;
                consumedEvents++;
            }
            if (consumedEvents) uiQueue.splice(0, consumedEvents);
            if (currentVisualStep !== lastDrawnStep) {
                updatePlaybackUI(currentVisualStep); 
                lastDrawnStep = currentVisualStep;
            }
        }

        const secondsPerBeat = 60.0 / bpm;
        const beatDuration = secondsPerBeat * 1000 * 2;
        breathingPhase = (timestamp % beatDuration) / beatDuration * Math.PI * 2;
        titleBreathingAmount = Math.sin(breathingPhase) * 0.5 + 0.5;

        // These point-matrix canvases are decorative and expensive to redraw.
        // Limiting them to 20 FPS leaves the main thread free to paint the
        // tracker playhead promptly after its per-frame audio-clock update.
        if (timestamp - lastDecorativeDrawTime >= DECORATIVE_FRAME_TIME) {
            drawTitleDotMatrix();
            drawStatusMetronome(timestamp);
            drawStepsStatus(timestamp);
            drawPresetStatus(timestamp);
            lastDecorativeDrawTime = timestamp;
        }

        if (timestamp - lastScopeDrawTime >= SCOPE_FRAME_TIME) {
            analyser.getByteTimeDomainData(scopeDataArray);
            let sum = 0;
            for (let i = 0; i < scopeDataArray.length; i++) {
                sum += Math.abs((scopeDataArray[i] - 128) / 128);
            }
            const average = sum / scopeDataArray.length;
            const threshold = 0.01;
            // 当检测到主输出有声音时才进行渲染
            if (average > threshold) {
                const animationMode = Math.floor(completedRounds / 4) % 4;
                if (animationMode === 0) {
                    renderMasterScope(); 
                } else if (animationMode === 1) {
                    renderComicEye(timestamp);
                } else if (animationMode === 2) {
                    renderPedestrianCrossing(timestamp);
                } else {
                    renderLunarWaves(timestamp);
                }
            } else {
                // 没有声音时，无论处于哪个阶段，都直接清空画布（熄灭LED）
                masterScopeAnimation.clear();
            }
            
            lastScopeDrawTime = timestamp;
        }
        
        requestAnimationFrame(drawLoop);
    }

    async function tryAutoLoadPreset() {
        try {
            let listResp = await fetch('/api/presets');
            if (listResp.ok) {
                const list = await listResp.json();
                if (Array.isArray(list.presets) && list.presets.length > 0) {
                    const preset = list.presets[Math.floor(Math.random() * list.presets.length)];
                    const resp = await fetch(preset.url + '?_=' + Date.now());
                    if (resp.ok) {
                        const text = await resp.text();
                        currentPresetName = preset.name;
                        await loadState(text);
                        updateStatusDisplay();
                        showToast('PRESET LOADED: ' + preset.name);
                        return true;
                    }
                }
            }
        } catch (e) {
            console.warn('Auto-load preset failed', e);
        }
        currentPresetName = 'default';
        return false;
    }

    const waveformPeakCache = new WeakMap();

    function getWaveformPeaks(buffer, width) {
        let byWidth = waveformPeakCache.get(buffer);
        if (!byWidth) {
            byWidth = new Map();
            waveformPeakCache.set(buffer, byWidth);
        }
        if (byWidth.has(width)) return byWidth.get(width);

        const data = buffer.getChannelData(0);
        const samplesPerPixel = Math.ceil(data.length / width);
        const peaks = new Float32Array(width * 2);
        for (let x = 0; x < width; x++) {
            let min = 1;
            let max = -1;
            const end = Math.min(data.length, (x + 1) * samplesPerPixel);
            for (let i = x * samplesPerPixel; i < end; i++) {
                const value = data[i];
                if (value < min) min = value;
                if (value > max) max = value;
            }
            peaks[x * 2] = min;
            peaks[x * 2 + 1] = max;
        }
        byWidth.set(width, peaks);
        return peaks;
    }

    function drawWaveform(t) {
        const canvas = document.getElementById(`wave-${t}`);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const track = tracks[t];
        const w = canvas.width; const h = canvas.height;

        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, w, h);
        
        if (track.type === 'FX') {
            ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1; ctx.beginPath();
            if (track.fxType === 'OFF') {
                ctx.moveTo(0, Math.floor(h/2)+0.5); ctx.lineTo(w, Math.floor(h/2)+0.5);
            } else if (track.fxType === 'LPF') {
                const cutoff = (track.p1 / 100) * w;
                ctx.moveTo(0, h/4); ctx.lineTo(cutoff, h/4); ctx.lineTo(cutoff + 10, h);
            } else if (track.fxType === 'HPF') {
                const cutoff = (track.p1 / 100) * w;
                ctx.moveTo(0, h); ctx.lineTo(cutoff - 10, h); ctx.lineTo(cutoff, h/4); ctx.lineTo(w, h/4);
            } else if (track.fxType === 'DLY') {
                const space = (track.p1 / 100) * 20 + 2;
                for(let i=0; i<5; i++) {
                    const x = 10 + i*space; const yH = h - (h * Math.pow(track.p2/100, i));
                    ctx.moveTo(x, h); ctx.lineTo(x, yH);
                }
            } else if (track.fxType === 'DIST') {
                const amp = (track.p1 / 100) * (h/2);
                ctx.moveTo(0, h/2); ctx.lineTo(w/4, h/2 - amp); ctx.lineTo(w*3/4, h/2 + amp); ctx.lineTo(w, h/2);
            } else if (track.fxType === 'RVB') {
                for(let i=0; i<w; i+=3) {
                    const noise = Math.random() * (track.p1/100) * h; const decay = 1 - (i/w);
                    ctx.moveTo(i, Math.floor(h/2 - noise*decay/2)+0.5); ctx.lineTo(i, Math.floor(h/2 + noise*decay/2)+0.5);
                }
            }
            ctx.stroke(); return;
        }

        if (!track.buffer) {
            ctx.fillStyle = '#333333'; ctx.font = '10px Courier New'; ctx.fillText('NO WAVE', 35, 20); return;
        }

        const peaks = getWaveformPeaks(track.buffer, w); const amp = h / 2;
        ctx.fillStyle = '#FFFFFF'; 
        for (let i = 0; i < w; i++) {
            const min = peaks[i * 2];
            const max = peaks[i * 2 + 1];
            const y = (1 + min) * amp; const waveHeight = Math.max(1, (max - min) * amp); 
            ctx.fillRect(i, y, 1, waveHeight);
        }

        if (track.mode === 'SLC') {
            ctx.strokeStyle = '#888888'; ctx.lineWidth = 1; ctx.setLineDash([2, 2]); 
            const sliceWidth = w / track.slices; ctx.beginPath();
            for(let i = 1; i < track.slices; i++) {
                const x = Math.floor(i * sliceWidth) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, h);
            }
            ctx.stroke(); ctx.setLineDash([]); 
        }
    }

    const workspace = document.getElementById('workspace');
    const stepCol = document.getElementById('step-col');
    const TRACKER_VISIBLE_ROWS = 16;
    const TRACKER_PLAYHEAD_ROW = Math.floor(TRACKER_VISIBLE_ROWS / 2);

    function getViewportStep(anchorStep, slot) {
        const step = anchorStep + slot - TRACKER_PLAYHEAD_ROW;
        return ((step % NUM_STEPS) + NUM_STEPS) % NUM_STEPS;
    }

    function syncWorkspaceContentAlignment() {
        if (workspace.scrollLeft === 0) {
            document.documentElement.style.setProperty('--workspace-content-left', `${stepCol.getBoundingClientRect().left}px`);
        }

        const lastTrack = document.getElementById(`track-${NUM_TRACKS - 1}`);
        if (!lastTrack) return;

        const workspaceRect = workspace.getBoundingClientRect();
        const maxScrollLeft = workspace.scrollWidth - workspace.clientWidth;
        const trackRightAtMaxScroll = lastTrack.getBoundingClientRect().right + workspace.scrollLeft - maxScrollLeft;
        const rightInset = Math.max(0, workspaceRect.right - trackRightAtMaxScroll);
        document.documentElement.style.setProperty('--workspace-content-right', `${rightInset}px`);
        alignScopeRightToLastTrack();
    }
    
    function changeNumSteps(newSteps) {
        newSteps = Math.max(4, Math.min(128, newSteps)); 
        if (newSteps === NUM_STEPS) return;

        const oldSteps = NUM_STEPS;
        const oldCursor = { t: cursor.t, s: cursor.s, c: cursor.c };
        NUM_STEPS = newSteps;

        tracks.forEach(track => {
            track.patterns.forEach(pattern => {
                if (NUM_STEPS > oldSteps) {
                    for (let i = oldSteps; i < NUM_STEPS; i++) pattern.push({ note: null, velocity: null });
                } else {
                    pattern.length = NUM_STEPS;
                }
            });
        });

        if (cursor.s >= NUM_STEPS) cursor.s = NUM_STEPS - 1;
        if (currentStep >= NUM_STEPS) currentStep = 0;

        renderTrackerViewport(cursor.s);
        updateCursorUI(oldCursor.t, oldCursor.s, oldCursor.c, cursor.t, cursor.s, cursor.c); updateStatusDisplay();
        uiQueue.length = 0;
    }

    tracks.forEach((_, t) =>  {
        const trackDiv = document.createElement('div');
        trackDiv.className = 'track'; trackDiv.id = `track-${t}`;
        workspace.appendChild(trackDiv);
    });

    stepCol.innerHTML = '<div class="track-header" style="justify-content:center;">#</div>';
    requestAnimationFrame(syncWorkspaceContentAlignment);
    window.addEventListener('resize', syncWorkspaceContentAlignment);

    function renderTrack(t) {
        const track = tracks[t];
        let html = '';

        if (track.type === 'AUDIO') {
            const shortName = track.fileName ? track.fileName.split('.')[0].substring(0, 11) : 'EMPTY';
            html += `
                <div class="track-header">
                    <div style="font-size: 10px;">${t.toString().padStart(2, '0')} [${track.mode}] V:${track.volume.toString().padStart(3, '0')}</div>
                    <div style="font-size: 10px; color: var(--text-yellow);">P:${track.currentPattern + 1}/4</div>
                    <div style="font-size: 10px; color: var(--text-yellow);">S1:${track.send1.toString().padStart(2, '0')} | S2:${track.send2.toString().padStart(2, '0')}</div>
                    <canvas id="wave-${t}" class="wave-canvas" width="100" height="30"></canvas>
                    <div style="font-size:11px; color:${track.buffer?'#FFFFFF':'#555'}; overflow:hidden; white-space:nowrap; width:100px;" title="${track.fileName || ''}">
                        ${track.buffer ? shortName : '-'} ${track.mode==='SLC'?`| S:${track.slices}`:''}
                    </div>
                </div>`;
        } else {
            html += `
                <div class="track-header">
                    <div style="color: #FFFFFF; font-size: 10px;">${t.toString().padStart(2, '0')} [FX] V:${track.volume.toString().padStart(3, '0')}</div>
                    <div style="font-size: 10px; color: var(--text-yellow);">P:${track.currentPattern + 1}/4</div>
                    <div style="font-size: 10px; color: var(--text-yellow);">P1:${track.p1.toString().padStart(2, '0')} | P2:${track.p2.toString().padStart(2, '0')}</div>
                    <canvas id="wave-${t}" class="wave-canvas" width="100" height="30"></canvas>
                    <div style="font-size:11px; color:#FFFFFF; overflow:hidden; white-space:nowrap; width:100px;">
                        TYPE: ${track.fxType}
                    </div>
                </div>`;
        }

        for (let slot = 0; slot < TRACKER_VISIBLE_ROWS; slot++) {
            const stepIndex = getViewportStep(renderTrack.anchorStep ?? cursor.s, slot);
            const step = track.patterns[track.currentPattern][stepIndex] || { note: null, velocity: null };
            const isCellActive = cursor.t === t && (isPlaying ? slot === TRACKER_PLAYHEAD_ROW : cursor.s === stepIndex);
            const isNoteActive = isCellActive && cursor.c === 0;
            const isVelActive = isCellActive && cursor.c === 1;
            
            if (track.type === 'FX') {
                html += `<div class="cell ${isCellActive ? 'active' : ''}" id="cell-${t}-slot-${slot}" data-step="${stepIndex}">
                    <span class="note empty ${isNoteActive?'col-active':''}">---</span>
                    <span class="velocity empty ${isVelActive?'col-active':''}">--</span>
                </div>`;
            } else {
                let noteStr = '---';
                if (step.note !== null) {
                    const octave = Math.floor(step.note / 12) - 2; noteStr = noteNames[step.note % 12] + octave;
                }
                const velStr = step.velocity !== null ? step.velocity.toString().padStart(2, '0') : '--';
                
                html += `<div class="cell ${isCellActive ? 'active' : ''}" id="cell-${t}-slot-${slot}" data-step="${stepIndex}">
                    <span class="note ${step.note===null?'empty':''} ${isNoteActive?'col-active':''}">${noteStr}</span>
                    <span class="velocity ${step.velocity===null?'empty':''} ${isVelActive?'col-active':''}">${velStr}</span>
                </div>`;
            }
        }
        
        const trackDom = document.getElementById(`track-${t}`);
        trackDom.innerHTML = html;
        trackDom.style.opacity = track.muted ? '0.4' : '1';
        drawWaveform(t); 
    }

    function renderTrackerViewport(anchorStep) {
        renderTrack.anchorStep = anchorStep;
        stepCol.innerHTML = '<div class="track-header" style="justify-content:center;">#</div>' +
            Array.from({ length: TRACKER_VISIBLE_ROWS }, (_, slot) => {
                const stepIndex = getViewportStep(anchorStep, slot);
                return `<div class="cell ${stepIndex % 4 === 0 ? 'step-accent' : ''}" id="row-slot-${slot}" data-step="${stepIndex}">${stepIndex.toString().padStart(2, '0')}</div>`;
            }).join('');
        renderAll();
        workspace.style.height = `${stepCol.scrollHeight}px`;
    }

    function updateSingleCell(trackIndex = cursor.t, stepIndex = cursor.s) {
        if (isPlaying) {
            const track = tracks[trackIndex];
            const anchorStep = renderTrack.anchorStep ?? cursor.s;
            for (let slot = 0; slot < TRACKER_VISIBLE_ROWS; slot++) {
                if (getViewportStep(anchorStep, slot) !== stepIndex) continue;
                const cell = document.getElementById(`cell-${trackIndex}-slot-${slot}`);
                if (!cell || track.type !== 'AUDIO') continue;
                const data = track.patterns[track.currentPattern][stepIndex];
                const note = cell.querySelector('.note');
                const velocity = cell.querySelector('.velocity');
                note.textContent = data.note === null
                    ? '---'
                    : noteNames[data.note % 12] + (Math.floor(data.note / 12) - 2);
                velocity.textContent = data.velocity === null ? '--' : data.velocity.toString().padStart(2, '0');
                note.classList.toggle('empty', data.note === null);
                velocity.classList.toggle('empty', data.velocity === null);
            }
            return;
        }
        renderTrackerViewport(cursor.s);
    }

    function updateCursorUI(oldT, oldS, oldC, newT, newS) {
        if (!isPlaying) {
            renderTrackerViewport(newS);
            return;
        }

        // Keep the playhead cursor highlight in sync without a full tracker redraw.
        for (const t of new Set([oldT, newT])) {
            const cell = document.getElementById(`cell-${t}-slot-${TRACKER_PLAYHEAD_ROW}`);
            if (cell) {
                cell.classList.toggle('active', t === newT);
                cell.querySelector('.note')?.classList.toggle('col-active', t === newT && newC === 0);
                cell.querySelector('.velocity')?.classList.toggle('col-active', t === newT && newC === 1);
            }
        }
    }

    function renderAll() { 
        tracks.forEach((_, t) => renderTrack(t)); 
    }
    
    function updateStatusDisplay() { 
        drawBpmValue();
        document.getElementById('status-bpm-value').dataset.rendered = 'true';
        drawStepsStatus();
        drawPresetStatus();
    }
    
    function updatePlaybackUI(step) {
        if (step < 0 || step >= NUM_STEPS) return;

        // During playback the viewport advances one row at a time. Update its
        // existing cells in place; rebuilding every track also redraws all audio
        // waveforms and can make the playhead fall behind the audio clock.
        renderTrack.anchorStep = step;
        for (let slot = 0; slot < TRACKER_VISIBLE_ROWS; slot++) {
            const stepIndex = getViewportStep(step, slot);
            const row = document.getElementById(`row-slot-${slot}`);
            if (row) {
                row.dataset.step = stepIndex;
                row.textContent = stepIndex.toString().padStart(2, '0');
                row.classList.toggle('step-accent', stepIndex % 4 === 0);
                row.classList.toggle('playing', slot === TRACKER_PLAYHEAD_ROW);
            }

            for (let t = 0; t < NUM_TRACKS; t++) {
                const cell = document.getElementById(`cell-${t}-slot-${slot}`);
                if (!cell) continue;
                const track = tracks[t];
                const data = track.patterns[track.currentPattern][stepIndex];
                const active = cursor.t === t && slot === TRACKER_PLAYHEAD_ROW;
                cell.dataset.step = stepIndex;
                cell.classList.toggle('active', active);
                cell.classList.toggle('playing', slot === TRACKER_PLAYHEAD_ROW);

                const note = cell.querySelector('.note');
                const velocity = cell.querySelector('.velocity');
                if (track.type === 'FX') {
                    note.textContent = '---';
                    velocity.textContent = '--';
                    note.classList.add('empty');
                    velocity.classList.add('empty');
                } else {
                    note.textContent = data.note === null
                        ? '---'
                        : noteNames[data.note % 12] + (Math.floor(data.note / 12) - 2);
                    velocity.textContent = data.velocity === null ? '--' : data.velocity.toString().padStart(2, '0');
                    note.classList.toggle('empty', data.note === null);
                    velocity.classList.toggle('empty', data.velocity === null);
                }
                note.classList.toggle('col-active', active && cursor.c === 0);
                velocity.classList.toggle('col-active', active && cursor.c === 1);
            }
        }
    }

    window.addEventListener('keydown', (e) => {
        if (!e.repeat && (e.ctrlKey || e.metaKey) && e.code === 'KeyO') {
            e.preventDefault();
            e.stopImmediatePropagation();
            openPresetBrowser();
        }
    }, true);

    window.addEventListener('keydown', (e) => {
        if (e.repeat) return; 
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (presetBrowser.open) {
            handlePresetBrowserKey(e);
            return;
        }
        if (sampleBrowser.open) {
            handleSampleBrowserKey(e);
            return;
        }

        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace', 'Delete'].includes(e.code) || e.shiftKey || e.ctrlKey || e.metaKey) {
            const key = e.key.toLowerCase();
            if (!(key === 'r' || key === 's' || key === 'o' || key === 'l' || e.key === 'F12')) {
                e.preventDefault(); 
            }
        }

        const track = tracks[cursor.t];
        const oldT = cursor.t; const oldS = cursor.s; const oldC = cursor.c;
        const inputStep = isPlaying
            ? getCurrentPlaybackStep()
            : cursor.s;
        const step = track.patterns[track.currentPattern][inputStep];

        if (e.ctrlKey || e.metaKey) {
            if (e.key === 'Enter') {
                e.preventDefault();
                suppressEnterFileDialog = true;
                openSampleBrowser();
                return;
            }
            if (e.key.toLowerCase() === 's') {
                e.preventDefault();
                (async () => {
                    try {
                        const s = await serializeState();
                        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(s);
                        const downloadAnchorNode = document.createElement('a');
                        downloadAnchorNode.setAttribute("href", dataStr);
                        downloadAnchorNode.setAttribute("download", "retro_tracker_project.json");
                        document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove();
                        showToast("PROJECT EXPORTED");
                    } catch (err) {
                        console.error(err); showToast('EXPORT FAILED');
                    }
                })();
                return;
            }
            if (e.key.toLowerCase() === 'l') {
                e.preventDefault();
                (async () => {
                    const savedData = localStorage.getItem('retro_tracker_state');
                    if (savedData) {
                        currentPresetName = 'Local';
                        await loadState(savedData);
                        updateStatusDisplay();
                    } else {
                        showToast("NO LOCAL DATA FOUND");
                    }
                })();
                return;
            }
            
            if (e.key === 'ArrowUp') {
                track.volume = Math.min(100, track.volume + 5);
                if (track.type === 'AUDIO' && track.activeVolNode) {
                    track.activeVolNode.gain.setValueAtTime(track.muted ? 0 : track.volume / 100, audioCtx.currentTime);
                } else if (track.type === 'FX') {
                    const info = cursor.t === 10 ? fx1NodeInfo : fx2NodeInfo;
                    info.output.gain.setValueAtTime(track.muted ? 0 : track.volume / 100, audioCtx.currentTime);
                }
                renderTrack(cursor.t); return;
            }
            if (e.key === 'ArrowDown') {
                track.volume = Math.max(0, track.volume - 5);
                if (track.type === 'AUDIO' && track.activeVolNode) {
                    track.activeVolNode.gain.setValueAtTime(track.muted ? 0 : track.volume / 100, audioCtx.currentTime);
                } else if (track.type === 'FX') {
                    const info = cursor.t === 10 ? fx1NodeInfo : fx2NodeInfo;
                    info.output.gain.setValueAtTime(track.muted ? 0 : track.volume / 100, audioCtx.currentTime);
                }
                renderTrack(cursor.t); return;
            }
            if (e.key === 'ArrowLeft') { track.currentPattern = (track.currentPattern - 1 + 4) % 4; renderTrack(cursor.t); return; }
            if (e.key === 'ArrowRight') { track.currentPattern = (track.currentPattern + 1) % 4; renderTrack(cursor.t); return; }
            if (e.key === ']') { changeNumSteps(NUM_STEPS + 4); return; }
            if (e.key === '[') { changeNumSteps(NUM_STEPS - 4); return; }
            
            if (e.code === 'Backspace') {
                for(let i = 0; i < NUM_STEPS; i++) {
                    track.patterns[track.currentPattern][i].note = null; 
                    track.patterns[track.currentPattern][i].velocity = null;
                }
                editHalf = 0; renderTrack(cursor.t); return;
            }
            
            if (e.key.toLowerCase() === 'm') {
                track.muted = !track.muted;
                if (track.type === 'AUDIO') {
                    if (track.activeVolNode) {
                        track.activeVolNode.gain.cancelScheduledValues(audioCtx.currentTime);
                        track.activeVolNode.gain.setValueAtTime(track.activeVolNode.gain.value, audioCtx.currentTime);
                        track.activeVolNode.gain.linearRampToValueAtTime(track.muted ? 0 : (track.volume / 100), audioCtx.currentTime + 0.01);
                    }
                } else if (track.type === 'FX') {
                    const info = cursor.t === 10 ? fx1NodeInfo : fx2NodeInfo;
                    info.output.gain.setValueAtTime(info.output.gain.value, audioCtx.currentTime);
                    info.output.gain.linearRampToValueAtTime(track.muted ? 0 : track.volume / 100, audioCtx.currentTime + 0.01);
                }
                renderTrack(cursor.t); return;
            }
        }

        if (e.shiftKey) {
            let moved = false;
            if (cursor.t < 10) { 
                if (e.key === 'ArrowUp') { track.send1 = Math.min(100, track.send1 + 5); moved = true; }
                if (e.key === 'ArrowDown') { track.send1 = Math.max(0, track.send1 - 5); moved = true; }
                if (e.key === 'ArrowRight') { track.send2 = Math.min(100, track.send2 + 5); moved = true; }
                if (e.key === 'ArrowLeft') { track.send2 = Math.max(0, track.send2 - 5); moved = true; }
                if (moved) updateTrackSends(track);
            } else { 
                if (e.key === 'ArrowUp') { track.p1 = Math.min(100, track.p1 + 5); moved = true; }
                if (e.key === 'ArrowDown') { track.p1 = Math.max(0, track.p1 - 5); moved = true; }
                if (e.key === 'ArrowRight') { track.p2 = Math.min(100, track.p2 + 5); moved = true; }
                if (e.key === 'ArrowLeft') { track.p2 = Math.max(0, track.p2 - 5); moved = true; }
                if (moved) updateFXParams(cursor.t - 10); 
            }
            if (moved) renderTrack(cursor.t);
            return; 
        }

        if (e.code === 'Space') {
            isPlaying = !isPlaying;
            updateStatusDisplay();
            editHalf = 0; 
            if (isPlaying) {
                currentStep = 0; 
                completedRounds = 0; // 新增：每次重新播放时重新计算轮数
                uiQueue.length = 0; 
                lastDrawnStep = -1; 
                nextNoteTime = audioCtx.currentTime + 0.05;
                scheduler();
            } else {
                clearTimeout(timerID);
                uiQueue.length = 0;
                const stoppedStep = lastDrawnStep >= 0
                    ? lastDrawnStep
                    : (currentStep - 1 + NUM_STEPS) % NUM_STEPS;
                cursor.s = stoppedStep;
                renderTrackerViewport(stoppedStep);
            }
        }
        if (!e.ctrlKey && !e.metaKey && e.key === '[') { bpm = Math.max(20, bpm - 1); updateStatusDisplay(); }
        if (!e.ctrlKey && !e.metaKey && e.key === ']') { bpm = Math.min(300, bpm + 1); updateStatusDisplay(); }

        let moved = false;
        if (e.key === 'ArrowUp') { cursor.s = (cursor.s - 1 + NUM_STEPS) % NUM_STEPS; moved = true; }
        if (e.key === 'ArrowDown') { cursor.s = (cursor.s + 1) % NUM_STEPS; moved = true; }
        if (e.key === 'ArrowLeft') { 
            if (cursor.c === 1) { cursor.c = 0; moved = true; }
            else { cursor.t = (cursor.t - 1 + NUM_TRACKS) % NUM_TRACKS; cursor.c = 1; moved = true; }
        }
        if (e.key === 'ArrowRight') { 
            if (cursor.c === 0) { cursor.c = 1; moved = true; }
            else { cursor.t = (cursor.t + 1) % NUM_TRACKS; cursor.c = 0; moved = true; }
        }
        
        if (moved) {
            editHalf = 0; updateCursorUI(oldT, oldS, oldC, cursor.t, cursor.s, cursor.c);
        }

        if (e.key === '\\') { 
            if (track.type === 'AUDIO') {
                track.mode = track.mode === 'SMP' ? 'SLC' : 'SMP'; renderTrack(cursor.t); 
            } else {
                const fxTypes = ['OFF', 'LPF', 'HPF', 'DLY', 'DIST', 'RVB'];
                let idx = fxTypes.indexOf(track.fxType);
                track.fxType = fxTypes[(idx + 1) % fxTypes.length];
                changeFX(cursor.t - 10, track.fxType); renderTrack(cursor.t);
            }
        }
        if (e.key === '-' && track.type === 'AUDIO' && track.mode === 'SLC') {
            track.slices = Math.max(2, Math.floor(track.slices / 2));
            renderTrack(cursor.t);
        }
        if (e.key === '=' && track.type === 'AUDIO' && track.mode === 'SLC') {
            track.slices = Math.min(64, Math.max(2, Math.floor(track.slices * 2)));
            renderTrack(cursor.t);
        }

        if (track.type === 'AUDIO') {
            if (cursor.c === 0) {
                const noteNum = keyMap[e.key.toLowerCase()];
                if (noteNum !== undefined) {
                    step.note = noteNum; step.velocity = 80; editHalf = 0; 
                    // Enter the step and audition it immediately, including while
                    // the sequencer is running. The live path does not choke its
                    // already scheduled playback voices.
                    playSample(cursor.t, noteNum, 80, 0);
                    cursor.s = isPlaying ? inputStep : Math.min(NUM_STEPS - 1, cursor.s + 1);
                    updateSingleCell(cursor.t, inputStep);
                    updateCursorUI(oldT, oldS, oldC, cursor.t, cursor.s, cursor.c);
                }
            } else if (cursor.c === 1) {
                if (e.key >= '0' && e.key <= '9') {
                    if (step.note !== null) { 
                        const digit = parseInt(e.key, 10);
                        if (editHalf === 0) { step.velocity = digit * 10; editHalf = 1; } 
                        else { step.velocity = Math.floor((step.velocity || 0) / 10) * 10 + digit; editHalf = 0; }
                        updateSingleCell(cursor.t, inputStep);
                    }
                }
            }

            if (e.code === 'Delete' || e.code === 'Backspace') {
                step.note = null; step.velocity = null; editHalf = 0; 
                updateSingleCell(cursor.t, inputStep);
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'Enter' && suppressEnterFileDialog) {
            suppressEnterFileDialog = false;
            return;
        }
        if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && tracks[cursor.t].type === 'AUDIO') {
            document.getElementById('file-input').click();
        }
    });

    function renderPresetBrowser() {
        const list = document.getElementById('preset-browser-list');
        const count = document.getElementById('preset-browser-count');
        const visibleRows = 14;
        const maxStartIndex = Math.max(0, presetBrowser.presets.length - visibleRows);
        const startIndex = Math.max(0, Math.min(presetBrowser.selectedIndex - Math.floor(visibleRows / 2), maxStartIndex));
        const visiblePresets = presetBrowser.presets.slice(startIndex, startIndex + visibleRows);
        count.textContent = `${presetBrowser.presets.length} PRESETS`;
        list.replaceChildren(...visiblePresets.map((preset, index) => {
            const presetIndex = startIndex + index;
            const row = document.createElement('div');
            const rowIndex = document.createElement('span');
            const rowPath = document.createElement('span');
            row.className = `preset-browser-row${presetIndex === presetBrowser.selectedIndex ? ' is-selected' : ''}`;
            rowIndex.className = 'preset-browser-index';
            rowPath.className = 'preset-browser-path';
            rowIndex.textContent = String(presetIndex + 1).padStart(4, '0');
            rowPath.textContent = preset.path;
            row.append(rowIndex, rowPath);
            return row;
        }));
    }

    function closePresetBrowser() {
        presetBrowser.open = false;
        document.getElementById('preset-browser').classList.remove('is-open');
    }

    async function openPresetBrowser() {
        try {
            if (presetBrowser.presets.length === 0) {
                const response = await fetch('/api/presets');
                if (!response.ok) throw new Error('Preset lookup failed');
                const data = await response.json();
                presetBrowser.presets = data.presets;
            }
            if (presetBrowser.presets.length === 0) throw new Error('No presets available');
            presetBrowser.selectedIndex = 0;
            presetBrowser.open = true;
            document.getElementById('preset-browser').classList.add('is-open');
            renderPresetBrowser();
        } catch (error) {
            console.error('Preset browser failed', error);
            showToast('SERVER PRESET BROWSER FAILED');
        }
    }

    async function loadServerPreset(preset) {
        try {
            closePresetBrowser();
            showToast('LOADING SERVER PRESET');
            const response = await fetch(preset.url + '?_=' + Date.now());
            if (!response.ok) throw new Error('Preset download failed');
            currentPresetName = preset.name;
            await loadState(await response.text());
            updateStatusDisplay();
            showToast(`PRESET LOADED: ${preset.name}`);
        } catch (error) {
            console.error('Server preset load failed', error);
            showToast('SERVER PRESET LOAD FAILED');
        }
    }

    function handlePresetBrowserKey(event) {
        event.preventDefault();
        const maxIndex = Math.max(0, presetBrowser.presets.length - 1);
        if (event.key === 'Escape') return closePresetBrowser();
        if (event.key === 'ArrowUp') presetBrowser.selectedIndex = Math.max(0, presetBrowser.selectedIndex - 1);
        else if (event.key === 'ArrowDown') presetBrowser.selectedIndex = Math.min(maxIndex, presetBrowser.selectedIndex + 1);
        else if (event.key === 'PageUp') presetBrowser.selectedIndex = Math.max(0, presetBrowser.selectedIndex - 14);
        else if (event.key === 'PageDown') presetBrowser.selectedIndex = Math.min(maxIndex, presetBrowser.selectedIndex + 14);
        else if (event.key === 'Home') presetBrowser.selectedIndex = 0;
        else if (event.key === 'End') presetBrowser.selectedIndex = maxIndex;
        else if (event.key === 'Enter') {
            // The global Enter keyup handler opens the client file picker. Consume
            // this key release because Enter was used to select a server preset.
            suppressEnterFileDialog = true;
            return loadServerPreset(presetBrowser.presets[presetBrowser.selectedIndex]);
        }
        else return;
        renderPresetBrowser();
    }

    function renderSampleBrowser() {
        const list = document.getElementById('sample-browser-list');
        const count = document.getElementById('sample-browser-count');
        const query = document.getElementById('sample-browser-query');
        const visibleRows = 14;
        const maxStartIndex = Math.max(0, sampleBrowser.filtered.length - visibleRows);
        const startIndex = Math.max(0, Math.min(sampleBrowser.selectedIndex - Math.floor(visibleRows / 2), maxStartIndex));
        const visibleSamples = sampleBrowser.filtered.slice(startIndex, startIndex + visibleRows);
        count.textContent = `${sampleBrowser.filtered.length} / ${sampleBrowser.samples.length}`;
        query.textContent = sampleBrowser.query || 'ALL';
        list.replaceChildren(...visibleSamples.map((sample, index) => {
            const sampleIndex = startIndex + index;
            const row = document.createElement('div');
            const rowIndex = document.createElement('span');
            const rowPath = document.createElement('span');
            row.className = `sample-browser-row${sampleIndex === sampleBrowser.selectedIndex ? ' is-selected' : ''}`;
            rowIndex.className = 'sample-browser-index';
            rowPath.className = 'sample-browser-path';
            rowIndex.textContent = String(sampleIndex + 1).padStart(4, '0');
            rowPath.textContent = sample.path;
            row.append(rowIndex, rowPath);
            return row;
        }));
    }

    function filterSampleBrowser() {
        const query = sampleBrowser.query.toLowerCase();
        sampleBrowser.filtered = sampleBrowser.samples.filter(sample => sample.path.toLowerCase().includes(query));
        sampleBrowser.selectedIndex = 0;
        renderSampleBrowser();
    }

    function closeSampleBrowser() {
        sampleBrowser.open = false;
        document.getElementById('sample-browser').classList.remove('is-open');
    }

    async function openSampleBrowser() {
        const track = tracks[cursor.t];
        if (track.type !== 'AUDIO') {
            showToast('SELECT AN AUDIO TRACK');
            return;
        }

        try {
            if (sampleBrowser.samples.length === 0) {
                const response = await fetch('/api/packs');
                if (!response.ok) throw new Error('Sample lookup failed');
                const data = await response.json();
                sampleBrowser.samples = data.samples;
            }
            sampleBrowser.query = '';
            sampleBrowser.filtered = sampleBrowser.samples;
            sampleBrowser.selectedIndex = 0;
            sampleBrowser.open = true;
            document.getElementById('sample-browser').classList.add('is-open');
            renderSampleBrowser();
        } catch (error) {
            console.error('Sample browser failed', error);
            showToast('SERVER SAMPLE BROWSER FAILED');
        }
    }

    async function loadServerSample(sample) {
        const track = tracks[cursor.t];
        try {
            closeSampleBrowser();
            showToast('LOADING SERVER SAMPLE');
            const audioResponse = await fetch(sample.url);
            if (!audioResponse.ok) throw new Error('Sample download failed');
            track.fileName = sample.name;
            track.buffer = await audioCtx.decodeAudioData(await audioResponse.arrayBuffer());
            renderTrack(cursor.t);
            updateCursorUI(cursor.t, cursor.s, cursor.c, cursor.t, cursor.s, cursor.c);
            showToast(`SERVER SAMPLE: ${sample.name}`);
        } catch (error) {
            console.error('Server sample import failed', error);
            showToast('SERVER SAMPLE LOAD FAILED');
        }
    }

    function handleSampleBrowserKey(event) {
        event.preventDefault();
        const maxIndex = Math.max(0, sampleBrowser.filtered.length - 1);
        if (event.key === 'Escape') return closeSampleBrowser();
        if (event.key === 'ArrowUp') sampleBrowser.selectedIndex = Math.max(0, sampleBrowser.selectedIndex - 1);
        else if (event.key === 'ArrowDown') sampleBrowser.selectedIndex = Math.min(maxIndex, sampleBrowser.selectedIndex + 1);
        else if (event.key === 'PageUp') sampleBrowser.selectedIndex = Math.max(0, sampleBrowser.selectedIndex - 14);
        else if (event.key === 'PageDown') sampleBrowser.selectedIndex = Math.min(maxIndex, sampleBrowser.selectedIndex + 14);
        else if (event.key === 'Home') sampleBrowser.selectedIndex = 0;
        else if (event.key === 'End') sampleBrowser.selectedIndex = maxIndex;
        else if (event.key === 'Backspace') {
            sampleBrowser.query = sampleBrowser.query.slice(0, -1);
            return filterSampleBrowser();
        } else if (event.key === 'Enter') {
            const sample = sampleBrowser.filtered[sampleBrowser.selectedIndex];
            // Loading closes the browser during keydown, so keyup can no longer
            // tell that Enter was handled here. Suppress the global file-picker action.
            suppressEnterFileDialog = true;
            if (sample) loadServerSample(sample);
            return;
        } else if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
            sampleBrowser.query += event.key;
            return filterSampleBrowser();
        } else return;
        renderSampleBrowser();
    }

    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file || tracks[cursor.t].type !== 'AUDIO') return;
        tracks[cursor.t].fileName = file.name;
        const arrayBuffer = await file.arrayBuffer();
        tracks[cursor.t].buffer = await audioCtx.decodeAudioData(arrayBuffer);
        renderTrack(cursor.t);
        e.target.value = ''; 
        updateCursorUI(cursor.t, cursor.s, cursor.c, cursor.t, cursor.s, cursor.c);
    });

    window.addEventListener('beforeunload', () => {
        try {
            const small = { bpm, NUM_STEPS, tracks: tracks.map(t => ({ type: t.type, mode: t.mode, slices: t.slices, volume: t.volume, muted: t.muted, send1: t.send1, send2: t.send2, p1: t.p1, p2: t.p2, fxType: t.fxType, fileName: t.fileName, currentPattern: t.currentPattern, patterns: t.patterns })) };
            localStorage.setItem('retro_tracker_state', JSON.stringify(small));
        } catch (e) { }
    });

    window.addEventListener('DOMContentLoaded', async () => {
        drawTitleDotMatrix();
        updateShortcutsDisplay();
        document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);
        document.getElementById('shortcuts-toggle').addEventListener('click', () => toggleShortcutsPanel());
        document.addEventListener('click', (event) => {
            const panel = document.getElementById('shortcuts-panel');
            const toggle = document.getElementById('shortcuts-toggle');
            if (!panel.contains(event.target) && !toggle.contains(event.target)) toggleShortcutsPanel(false);
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') toggleShortcutsPanel(false);
        });
        const loaded = await tryAutoLoadPreset();
        if (!loaded) {
            renderTrackerViewport(cursor.s); updateStatusDisplay(); updateCursorUI(0, 0, 0, 0, 0, 0);
        }
        requestAnimationFrame(drawLoop);
    });
</script>
</body>
